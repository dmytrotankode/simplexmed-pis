# ==============================================================================
# Nginx Configuration for SimplexMed Patient Portal (КПІС)
# Domains: my-dev.simplex-med.com (Dev) and my.simplex-med.com (Prod)
# ==============================================================================

# 1. DEV Контур: my-dev.simplex-med.com
server {
    listen 80;
    listen 443 ssl http2;
    server_name my-dev.simplex-med.com;

    # SSL сертифікат (якщо термінується на Nginx; за Cloudflare достатньо Cloudflare Origin CA)
    # ssl_certificate /etc/ssl/certs/simplex-med.com.crt;
    # ssl_certificate_key /etc/ssl/private/simplex-med.com.key;

    # Безпечні заголовки (КСЗІ / Наказ НСЗУ № 978)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 1.1. Пацієнтський API Backend (PIS BFF Service)
    location /api/ {
        proxy_pass http://127.0.0.1:3122/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # 1.2. Системний healthcheck
    location /health {
        proxy_pass http://127.0.0.1:3122/health;
        proxy_set_header Host $host;
    }

    # 1.3. Веб-інтерфейс кабінету пацієнта (Frontend)
    location / {
        root /var/www/simplex-pis/web;
        try_files $uri $uri/ /index.html;
        index index.html;

        # Кешування статичних ресурсів
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}

# 2. PROD Контур: my.simplex-med.com
server {
    listen 80;
    listen 443 ssl http2;
    server_name my.simplex-med.com;

    # Безпечні заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3122/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90;
    }

    location / {
        root /var/www/simplex-pis/web;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
