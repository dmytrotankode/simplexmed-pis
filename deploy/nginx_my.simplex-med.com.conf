# ==============================================================================
# nginx для кабінету пацієнта «Плексі» (КПІС SimplexMed)
# Домени: my-dev.simplex-med.com (dev) і my.simplex-med.com. На цьому сервері обидва ведуть до одного
# BFF: gunicorn на 127.0.0.1:3122 (pis/backend/gunicorn.conf.py; pm2 — deploy-pm2.sh, systemd — deploy.sh).
#
# Схема: браузер / застосунок -> Cloudflare (проксі, SSL/TLS: Full (strict)) -> nginx :443 -> gunicorn.
# УСІ шляхи проксуються до Flask, каталог web/ nginx сам не віддає: заголовки безпеки застосунку
# (CSP frame-ancestors, X-Frame-Options, Cross-Origin-Opener-Policy, Referrer-Policy, Cache-Control —
# backend/app.py, SECURITY_HEADERS) мають діяти і для index.html, mobile-sign.html, /lib/euscp/*, а маршрути
# /ehealth/return/* (повернення з ЕСОЗ у кабінет і застосунок) і /api/* обробляє лише застосунок.
# Тому nginx НЕ додає власних X-Frame-Options / CSP: два різні заголовки браузер трактує непередбачувано.
#
# Встановлення (від root):
#   cp pis/deploy/nginx_my.simplex-med.com.conf /etc/nginx/sites-available/my-simplex-med.conf
#   ln -sf /etc/nginx/sites-available/my-simplex-med.conf /etc/nginx/sites-enabled/my-simplex-med.conf
#   nginx -t && systemctl reload nginx
# Потрібен ngx_http_realip_module (є в пакетах nginx Debian/Ubuntu): nginx -V 2>&1 | grep -o with-http_realip_module
# HTTP/2 між Cloudflare і сервером не потрібен (браузер говорить HTTP/2/3 з Cloudflare), тому "listen ... http2"
# не вмикаємо — так конфігурація однаково працює з nginx 1.18 і з 1.25+ (де замість нього директива "http2 on").
# IPv6: якщо в DNS є AAAA-запис сервера, додайте "listen [::]:80;" і "listen [::]:443 ssl;".
# ==============================================================================

# HTTP -> HTTPS. За Cloudflare Full (strict) Cloudflare звертається до сервера лише на 443; порт 80 — для прямих
# звернень і продовження сертифіката Let's Encrypt (якщо він використовується замість сертифіката Cloudflare).
# Режим SSL/TLS «Flexible» у Cloudflare НЕ вмикати: Cloudflare ходив би на 80 і отримував би цей редирект (цикл).
server {
    listen 80;
    server_name my-dev.simplex-med.com my.simplex-med.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name my-dev.simplex-med.com my.simplex-med.com;
    server_tokens off;

    # --- TLS: Cloudflare Full (strict) ---
    # Сертифікат походження Cloudflare (SSL/TLS -> Origin Server -> Create Certificate; імена *.simplex-med.com
    # і simplex-med.com). ЗАМІНИТИ шляхи, якщо файли лежать деінде; ключ — власник root, chmod 600.
    # Підходить і сертифікат Let's Encrypt: /etc/letsencrypt/live/<ім'я>/fullchain.pem і privkey.pem.
    ssl_certificate     /etc/ssl/cloudflare/simplex-med.com.origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/simplex-med.com.origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:PIS_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling не вмикаємо: сертифікат походження Cloudflare не має OCSP, Cloudflare його не перевіряє.
    # Щоб сервер приймав HTTPS лише від Cloudflare, увімкніть у Cloudflare Authenticated Origin Pulls і тут:
    #   ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    #   ssl_verify_client on;

    # --- HSTS ---
    # Застосунок сам надсилає Strict-Transport-Security; nginx замінює його тим самим значенням, щоб заголовок
    # був один і був також у відповідях, які формує сам nginx (502/504, коли gunicorn недоступний).
    # preload не додавати без рішення щодо всіх піддоменів simplex-med.com.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Справжня IP-адреса користувача за Cloudflare (ngx_http_realip_module) ---
    # CF-Connecting-IP стає $remote_addr лише для з'єднань із мереж Cloudflare; від будь-кого іншого заголовок
    # ігнорується, тож клієнт, що звертається до сервера напряму, не підробить свою адресу. Застосунок довіряє
    # тільки X-Forwarded-For, який виставляє цей nginx (ProxyFix, один проксі): від нього залежать обмеження
    # частоти запитів і журнал сесій. Діапазони Cloudflare: https://www.cloudflare.com/ips/ — звіряти при кожній
    # зміні конфігурації (порожній вивід = збігаються):
    #   diff <({ curl -fsS https://www.cloudflare.com/ips-v4; echo; curl -fsS https://www.cloudflare.com/ips-v6; echo; } | grep . | sort) \
    #        <(grep -oP 'set_real_ip_from\s+\K[^;]+' /etc/nginx/sites-enabled/my-simplex-med.conf | sort -u)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Копії документів до 20 МБ (п.3.6.1) у multipart; та сама межа у Flask (MAX_CONTENT_LENGTH = 21 МБ)
    client_max_body_size 21m;

    # Службові файли (.env, .git тощо) не віддаються ніколи; /.well-known/ лишається доступним
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3122;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Адреса користувача — лише та, яку визначив nginx (див. realip вище); X-Forwarded-For від клієнта
        # відкидається, а не доповнюється
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Заголовки, яким могли б повірити Flask/gunicorn, від клієнта далі не передаються
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";

        # gunicorn: timeout 120 с (запит до ЕСОЗ — до 60 с, п.1.3.2); nginx чекає трохи довше за gunicorn
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        # Тіло запиту (до 21 МБ) nginx приймає повністю, перш ніж зайняти потік gunicorn
        proxy_request_buffering on;
    }
}
