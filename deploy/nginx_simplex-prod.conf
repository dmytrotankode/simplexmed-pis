# ==============================================================================
# SimplexMed 2.0 Production / Alias Domains
# Domains:
#   - app2.simplex-med.com -> MIS Staff Frontend (127.0.0.1:3121)
#   - my.simplex-med.com   -> PIS Patient Portal (127.0.0.1:3122)
# ==============================================================================

# 1. MIS STAFF FRONTEND
server {
    server_name app2.simplex-med.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3121;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/simplex-med/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simplex-med/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# 2. PIS PATIENT PORTAL
server {
    server_name my.simplex-med.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3122;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/simplex-med/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simplex-med/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = app2.simplex-med.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name app2.simplex-med.com;
    return 404;
}

server {
    if ($host = my.simplex-med.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name my.simplex-med.com;
    return 404;
}
