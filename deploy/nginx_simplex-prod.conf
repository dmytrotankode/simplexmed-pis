# ==============================================================================
# SimplexMed 2.0 Production / Alias Domains
# Domains:
#   - app2.simplex-med.com -> MIS Staff Frontend (127.0.0.1:3121)
#   - my.simplex-med.com   -> PIS Patient Portal «Плексі» (127.0.0.1:3122, gunicorn: pis/backend/gunicorn.conf.py)
#
# Обидва домени — за Cloudflare (проксі, SSL/TLS: Full (strict)). Режим «Flexible» НЕ вмикати: Cloudflare ходив
# би на порт 80 і отримував би редирект на HTTPS (цикл).
# Кабінет пацієнта: УСІ шляхи проксуються до Flask, щоб заголовки безпеки застосунку (CSP frame-ancestors,
# X-Frame-Options, Cross-Origin-Opener-Policy — backend/app.py) діяли і для index.html та mobile-sign.html,
# а /ehealth/return/* і /api/* обробляв застосунок; власних X-Frame-Options / CSP nginx не додає.
# Перевірка: nginx -t && systemctl reload nginx. Потрібен ngx_http_realip_module (є в пакетах Debian/Ubuntu).
# ==============================================================================

# 1. MIS STAFF FRONTEND
server {
    server_name app2.simplex-med.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3121;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/simplex-med/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simplex-med/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# 2. PIS PATIENT PORTAL «Плексі» (КПІС)
server {
    listen 443 ssl;
    server_name my.simplex-med.com;
    server_tokens off;

    # --- TLS: Cloudflare Full (strict) ---
    # Сертифікат Let's Encrypt, спільний з app2 (certbot --nginx): include задає протоколи TLSv1.2/1.3, шифри
    # і кеш сесій. Сертифікат походження Cloudflare теж підходить для Full (strict): тоді замініть два шляхи
    # нижче (ЗАМІНИТИ: /etc/ssl/cloudflare/simplex-med.com.origin.pem і .key), а include і ssl_dhparam — на
    # параметри TLS із nginx_my.simplex-med.com.conf. OCSP stapling не вмикаємо.
    ssl_certificate /etc/letsencrypt/live/simplex-med/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simplex-med/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- HSTS ---
    # Застосунок сам надсилає Strict-Transport-Security; nginx замінює його тим самим значенням, щоб заголовок
    # був один і був також у відповідях самого nginx (502/504, коли gunicorn недоступний). Без preload.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Справжня IP-адреса користувача за Cloudflare (ngx_http_realip_module) ---
    # CF-Connecting-IP стає $remote_addr лише для з'єднань із мереж Cloudflare; від будь-кого іншого заголовок
    # ігнорується. Застосунок довіряє тільки X-Forwarded-For від цього nginx (ProxyFix, один проксі): від нього
    # залежать обмеження частоти запитів і журнал сесій. Діапазони: https://www.cloudflare.com/ips/ — звіряти
    # при кожній зміні конфігурації (порожній вивід = збігаються):
    #   diff <({ curl -fsS https://www.cloudflare.com/ips-v4; echo; curl -fsS https://www.cloudflare.com/ips-v6; echo; } | grep . | sort) \
    #        <(grep -oP 'set_real_ip_from\s+\K[^;]+' <цей файл у /etc/nginx/sites-enabled/> | sort -u)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Копії документів до 20 МБ (п.3.6.1) у multipart; та сама межа у Flask (MAX_CONTENT_LENGTH = 21 МБ)
    client_max_body_size 21m;

    # Службові файли (.env, .git тощо) не віддаються ніколи; /.well-known/ лишається доступним
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3122;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Адреса користувача — лише та, яку визначив nginx; X-Forwarded-For від клієнта відкидається
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Заголовки, яким могли б повірити Flask/gunicorn, від клієнта далі не передаються
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";

        # gunicorn: timeout 120 с (запит до ЕСОЗ — до 60 с, п.1.3.2); nginx чекає трохи довше за gunicorn
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        # Тіло запиту (до 21 МБ) nginx приймає повністю, перш ніж зайняти потік gunicorn
        proxy_request_buffering on;
    }
}

server {
    if ($host = app2.simplex-med.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name app2.simplex-med.com;
    return 404;
}

# HTTP -> HTTPS для кабінету; /.well-known/acme-challenge/ — для продовження сертифіката Let's Encrypt
# (certbot --webroot -w /var/www/letsencrypt; плагін certbot --nginx додає власний location сам)
server {
    listen 80;
    server_name my.simplex-med.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
